<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AffiliShop</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="shop-page">
    <a class="logo" href="/">AffiliShop</a>
    <div id="shopContent" class="shop-content">
      <p class="muted">Loading shop...</p>
    </div>
  </main>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const shopId = params.get("id");

    const escapeHtml = (value) => String(value ?? "")
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");

    async function loadShop() {
      const content = document.getElementById("shopContent");

      if (!shopId) {
        content.innerHTML = '<p class="muted">Shop ID is missing.</p>';
        return;
      }

      try {
        const response = await fetch(`/api/shops/${encodeURIComponent(shopId)}`);
        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || "Shop not found.");
        }

        content.innerHTML = `
          <div class="head">
            <div>
              <small>PUBLIC AFFILISHOP</small>
              <h1>${escapeHtml(data.shop.name)}</h1>
              <p>${escapeHtml(data.shop.description || "")}</p>
            </div>
          </div>
          <div class="grid">
            ${data.shop.products.map((product) => `
              <article class="card">
                <div class="pic">
                  <img src="${escapeHtml(product.imageUrl)}" alt="${escapeHtml(product.name)}" loading="lazy">
                </div>
                <div class="info">
                  <span class="badge">${escapeHtml(product.badge || "New")}</span>
                  <h3>${escapeHtml(product.name)}</h3>
                  <span class="price">₱${Number(product.price).toFixed(2)}</span>
                  ${product.oldPrice ? `<span class="old">₱${Number(product.oldPrice).toFixed(2)}</span>` : ""}
                  <a class="visit" href="${escapeHtml(product.affiliateUrl)}" target="_blank" rel="noopener noreferrer">Visit Product →</a>
                </div>
              </article>
            `).join("") || '<p class="muted">This shop has no products yet.</p>'}
          </div>
        `;
      } catch (error) {
        content.innerHTML = `<p class="muted">${escapeHtml(error.message)}</p>`;
      }
    }

    loadShop();
  </script>
</body>
</html>
